[project]
name = "kirin-mlir"
version = "0.1.0-dev"
description = "Out-of-tree MLIR interoperability for the Kirin compiler toolchain."
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    # 0.22.16 is the latest release as of 2026-09-07; the reference checkout at
    # ~/Documents/kirin is 0.23.0-dev (commit 0c559fd67). Re-check before pinning
    # tighter — the emit and serialization internals this depends on are pre-1.0.
    "kirin-toolchain>=0.22.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirin_mlir"]

[dependency-groups]
dev = [
    # Real MLIR is the oracle: tests shell out to `mlir-opt`, which is NOT a
    # Python package. Install it from apt.llvm.org (see README prerequisites).
    # MLIR Python bindings are deliberately absent here — `mlir` and
    # `mlir-python-bindings` on PyPI are 0.0.1 name-squat placeholders, not real
    # bindings. The only routes are building LLVM with
    # -DMLIR_ENABLE_BINDINGS_PYTHON=ON, or third-party nightly wheels.
    "pytest>=8.3.3",
    "black>=25.0",
    "isort>=5.13.2",
    "ruff>=0.7.3",
    "pre-commit>=4.0.1",
]

# Optional: xDSL gives a pure-Python parse/verify loop with no MLIR install.
# Useful for fast unit tests, but it is a convenience, not the source of truth.
xdsl = ["xdsl>=0.70"]

[tool.isort]
profile = "black"
combine_as_imports = true
multi_line_output = 3
length_sort = true
src_paths = ["src/kirin_mlir"]

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py310"

[tool.pyright]
include = ["src"]
