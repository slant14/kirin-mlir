[project]
name = "kirin-mlir"
version = "0.1.0-dev"
description = "Out-of-tree MLIR interoperability for the Kirin compiler toolchain."
# No `readme`: README.md is not tracked, and hatchling refuses to build when
# the file it names is missing, so a fresh clone could not be installed.
requires-python = ">= 3.10"
dependencies = [
    # At least 0.22.17: before it, type inference paired a statement's fields
    # with its values position by position, so a group of arguments shifted
    # every later value onto the wrong field's type, often Bottom (stim's
    # DETECTOR coordinates; docs/assessment.md, 2026-10-13). Below 0.23 because
    # bloqade-circuit, the stim extra, requires ~=0.22.11, and uv locks every
    # extra together; re-check when bloqade moves to 0.23 (issue 05).
    "kirin-toolchain>=0.22.17,<0.23",
]

[project.optional-dependencies]
# Issue 05: export bloqade.stim kernels, and simulate them with stim to check
# the export. bloqade-circuit is pre-1.0 like Kirin; 0.15.3 is what was measured.
stim = [
    "bloqade-circuit>=0.15.3,<0.16",
    "stim>=1.15",
]

[project.scripts]
kirin-mlir = "kirin_mlir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirin_mlir"]

[dependency-groups]
dev = [
    # Real MLIR is the oracle: tests shell out to `mlir-opt`, which is NOT a
    # Python package. Install it from apt.llvm.org (see README prerequisites).
    # MLIR Python bindings are deliberately absent here — `mlir` and
    # `mlir-python-bindings` on PyPI are 0.0.1 name-squat placeholders, not real
    # bindings. The only routes are building LLVM with
    # -DMLIR_ENABLE_BINDINGS_PYTHON=ON, or third-party nightly wheels.
    "pytest>=8.3.3",
    "black>=25.0",
    "isort>=5.13.2",
    "ruff>=0.7.3",
    "pre-commit>=4.0.1",
]

# Optional: xDSL gives a pure-Python parse/verify loop with no MLIR install.
# Useful for fast unit tests, but it is a convenience, not the source of truth.
xdsl = ["xdsl>=0.70"]

[tool.pytest.ini_options]
# Import from src/ directly. When iCloud Drive syncs this folder it marks .venv
# hidden, and Python then skips the editable install's .pth file (README).
pythonpath = ["src"]

[tool.isort]
profile = "black"
combine_as_imports = true
multi_line_output = 3
length_sort = true
src_paths = ["src/kirin_mlir"]

[tool.black]
line-length = 88
# Python's floor, as for ruff. Without it Black targets every version up to the
# newest it knows and warns that the venv's Python cannot check that output.
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.pyright]
include = ["src"]
